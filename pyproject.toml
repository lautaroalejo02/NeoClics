[project]
name = "muestra"
version = "0.0.0"
description = "Muestra: AI-native music studio core (contracts + project scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2",
    "tomli-w>=1.1.0",
]

# Optional dependency groups, one per work package. Each WP adds its own
# heavy deps to ITS OWN group only, so installs stay light and parallel
# work does not conflict on this file.
[project.optional-dependencies]
ingest = []
render = []
plugins = []
library = []
ears = []
server = []

[project.scripts]
muestra = "muestra.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # only needed to regenerate committed fixture audio (fixtures/gen_audio.py)
    "numpy>=2.1",
    "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muestra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
