[project]
name = "muestra"
version = "0.0.0"
description = "Muestra: AI-native music studio core (contracts + project scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2",
    "ruamel.yaml>=0.18",
    "tomli-w>=1.1.0",
    # shared audio stack: used by every audio-touching WP, so it lives in
    # base dependencies (see docs/decisions.md and CONTRIBUTING-AGENTS.md)
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.13",
    "pedalboard>=0.9.14",
    "mido>=1.3.3",
    "pyloudnorm>=0.2.0,<0.3",
    # A plain `uv sync` does everything except heavy stem separation
    # (WP11, docs/decisions.md): server (HTTP API + MCP), beat tracking.
    "fastapi>=0.163.1,<1",
    "uvicorn[standard]>=0.54,<1",
    "mcp>=2.3,<3",
    "portalocker>=4.4.2,<5",
    "beat-this>=1.1.0,<2",
    "psutil>=7.2,<8",
    "audioread>=3.0,<4",
]

# Optional dependency groups, one per work package. Each WP adds its own
# heavy deps to ITS OWN group only (multi-line array, one dep per line),
# so parallel work does not conflict on this file.
[project.optional-dependencies]

# Stem separation (Demucs / Mel-Band RoFormer): the only heavy optional part.
# `uv sync --extra separation`. Model weights download on first use.
separation = [
    "demucs-infer>=4.4.0,<5",
    "audio-separator[cpu]>=0.48.0,<0.49",
]

# Backwards-compatible alias of the WP1 group name.
ingest = [
    "muestra[separation]",
]

# Kept (empty) so older `--extra <name>` commands keep working; their
# dependencies now live in the base install.
server = [
]
render = [
]
plugins = [
]
library = [
]

# WP6 (ears / metrics)
ears = [
]

[project.scripts]
muestra = "muestra.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # starlette's TestClient (tests/api)
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muestra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
