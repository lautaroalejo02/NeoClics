[project]
name = "muestra"
version = "0.0.0"
description = "Muestra: AI-native music studio core (contracts + project scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2",
    "ruamel.yaml>=0.18",
    "tomli-w>=1.1.0",
    # shared audio stack: used by every audio-touching WP, so it lives in
    # base dependencies (see docs/decisions.md and CONTRIBUTING-AGENTS.md)
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.13",
    "pedalboard>=0.9.14",
]

# Optional dependency groups, one per work package. Each WP adds its own
# heavy deps to ITS OWN group only (multi-line array, one dep per line),
# so parallel work does not conflict on this file.
[project.optional-dependencies]

# WP1 (ingest: separation + analysis)
ingest = [
    "demucs-infer>=4.4.0,<5",
    "audio-separator[cpu]>=0.48.0,<0.49",
    "beat-this>=1.1.0,<2",
    "pyloudnorm>=0.2.0,<0.3",
    "psutil>=7.2,<8",
    "audioread>=3.0,<4",
]

# WP2 (renderer)
render = [
    "pyloudnorm>=0.1.1",
    "mido>=1.3.3",
]

# WP3 (plugin hosting + instruments)
plugins = [
]

# WP4 (sample library)
library = [
]

# WP6 (ears / metrics)
ears = [
]

# WP7 (API + MCP + CLI)
server = [
]

[project.scripts]
muestra = "muestra.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muestra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
