schema_version: 0
# PLANTILLA future funk, grilla normal: un disco que el tracker mide entre ~95 y ~140 BPM.
# Cambia: source y chop (source.find_chops + chops.choose), meta.bpm (calculo de
# resample en recipes/future-funk.md), meta.key, la tonica del bajo (A) y los gain_db.
meta:
  title: borrador-01
  bpm: 124.0  # = tempo local del chop x 2^(semitonos/12)
  key: Am
  length_bars: 16
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other
  start_downbeat: 17
  length_beats: 8  # 2 compases
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 8
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 8}
  fx:
  - {id: hp, type: highpass, cutoff_hz: 150}
  - {id: lp, type: lowpass, cutoff_hz: 18000}
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 140}
  gain_db: 0
- id: kick
  pattern:
    steps_per_bar: 16
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 5
  pattern:
    steps_per_bar: 16
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -5}
      chat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/chat-tr-8-closed-hat-01.wav", steps: "x.o.x.o.x.o.x.o.", gain_db: -12}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -10}
- id: bass
  at_bar: 5
  instrument: {plugin: finger-bass}
  notes:  # contratiempos: tonica, tonica, octava, tonica
  - {beat: 17.5, pitch: A1, length_beats: 0.4, velocity: 100}
  - {beat: 18.5, pitch: A1, length_beats: 0.4, velocity: 92}
  - {beat: 19.5, pitch: A2, length_beats: 0.4, velocity: 100}
  - {beat: 20.5, pitch: A1, length_beats: 0.4, velocity: 92}
  - {beat: 21.5, pitch: A1, length_beats: 0.4, velocity: 100}
