schema_version: 0
# Tiger Rag (The Home Towners, 1928; CC0), primeros 30 s, fuente src1.
# El tracker la lee a 250 BPM (cuenta corcheas); source.analyze eligio la octava
# en 70-160 y la grilla quedo en 125 BPM (grid.tempo_factor 0.5). Grilla NORMAL:
# compases musicales, patrones de 16 pasos. Antes de armar el tema, el humano
# confirma la grilla de oido (source.preview_grid).
meta:
  title: tiger-funk-yungbae
  bpm: 126.32  # igual que la base: afinado
  key: G  # igual que la base
  length_bars: 16
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other
  start_downbeat: 9
  length_beats: 8
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 8
phrases:
- id: groove  # octava y notas de paso (Sol, Re, Fa)
  length_bars: 1
  notes:
  - {beat: 1.5, pitch: G1, length_beats: 0.35, velocity: 100}
  - {beat: 2, pitch: G2, length_beats: 0.25, velocity: 80}
  - {beat: 2.5, pitch: G1, length_beats: 0.35, velocity: 96}
  - {beat: 3.5, pitch: D2, length_beats: 0.25, velocity: 100}
  - {beat: 3.75, pitch: F2, length_beats: 0.25, velocity: 84}
  - {beat: 4.5, pitch: G1, length_beats: 0.35, velocity: 96}
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 8}
  fx:
  - {id: hp, type: highpass, cutoff_hz: 160}
  - {id: lp, type: lowpass, cutoff_hz: 18000}
  - {id: chorus, type: chorus, rate_hz: 0.4, depth: 0.2, mix: 0.25}  # brillo pulido
  - {id: sc, type: sidechain, key_track: kick, depth: 0.45, release_ms: 120}
  gain_db: 9
- id: kick
  until_bar: 13  # sale en el break (compases 13 y 14)
  pattern:
    steps_per_bar: 16
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: kick-back
  at_bar: 15  # vuelve en los ultimos 2 compases
  pattern:
    steps_per_bar: 16
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 5
  until_bar: 13
  pattern:
    steps_per_bar: 16
    swing: 0.2  # semicorcheas apenas arrastradas: groove
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -5}
      chat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/chat-tr-8-closed-hat-01.wav", steps: "xoxoxoxoxoxoxoxo", gain_db: -14}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -10}
      perc: {sample: "library://kits/tr808-musicradar/cowbell-cb/cowbell-e808-cb-02.wav", steps: "...........o..o.", gain_db: -16}
- id: bass
  at_bar: 5
  instrument: {plugin: finger-bass}  # slap-bass tambien sirve; ver styles.md
  phrases:
  - {phrase: groove, repeat: 8}  # compases 5-12; calla en el break
  - {phrase: groove, at_bar: 15}  # vuelve con el bombo
  fx:
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 90}
  gain_db: 10
automation:
- {target: tracks.sample.fx.lp.cutoff_hz, curve: exp, points: [[1, 600], [5, 18000], [13, 18000], [15, 900], [15, 18000]]}  # intro y break filtrados
master:
  fx:
  - {type: compressor, threshold_db: -18, ratio: 3}
  - {type: limiter, ceiling_db: -1.0}
  target_lufs: -12
