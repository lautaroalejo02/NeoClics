schema_version: 0
# Tiger Rag (The Home Towners, 1928; CC0), primeros 30 s, fuente src1.
# El tracker la mide a ~250 BPM: cuenta corcheas. DOBLE GRILLA:
#   1 compas musical = 2 compases del proyecto, 1 beat del proyecto = 1 corchea,
#   patrones con steps_per_bar: 8 y bars: 2 (16 caracteres = 1 compas musical).
# Ver recipes/future-funk.md, "Fuente a doble tempo".
meta:
  title: tiger-funk-yungbae
  bpm: 252.64  # igual que la base: sensacion 126.3, afinado
  key: G  # igual que la base
  length_bars: 32  # 16 compases musicales
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other
  start_downbeat: 17
  length_beats: 16
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 8
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 8}
  fx:
  - {id: hp, type: highpass, cutoff_hz: 160}
  - {id: lp, type: lowpass, cutoff_hz: 18000}
  - {id: chorus, type: chorus, rate_hz: 0.4, depth: 0.2, mix: 0.25}  # brillo pulido
  - {id: sc, type: sidechain, key_track: kick, depth: 0.45, release_ms: 120}
  gain_db: 9
- id: kick
  until_bar: 25  # sale en el break (compases musicales 13 y 14)
  pattern:
    steps_per_bar: 8
    bars: 2
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: kick-back
  at_bar: 29  # vuelve en los ultimos 2 compases musicales
  pattern:
    steps_per_bar: 8
    bars: 2
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 9
  until_bar: 25
  pattern:
    steps_per_bar: 8
    bars: 2
    swing: 0.2  # semicorcheas apenas arrastradas: groove
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -5}
      chat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/chat-tr-8-closed-hat-01.wav", steps: "xoxoxoxoxoxoxoxo", gain_db: -14}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -10}
      perc: {sample: "library://kits/tr808-musicradar/cowbell-cb/cowbell-e808-cb-02.wav", steps: "...........o..o.", gain_db: -16}
- id: bass
  at_bar: 9
  instrument: {plugin: finger-bass}  # slap-bass da avisos `click` en estas notas cortas (ver styles.md)
  notes:  # linea con octava y notas de paso (Sol, Re, Fa); calla en el break
  - {beat: 34, pitch: G1, length_beats: 0.7, velocity: 100}
  - {beat: 35, pitch: G2, length_beats: 0.5, velocity: 80}
  - {beat: 36, pitch: G1, length_beats: 0.7, velocity: 96}
  - {beat: 38, pitch: D2, length_beats: 0.5, velocity: 100}
  - {beat: 38.5, pitch: F2, length_beats: 0.5, velocity: 84}
  - {beat: 40, pitch: G1, length_beats: 0.7, velocity: 96}
  - {beat: 42, pitch: G1, length_beats: 0.7, velocity: 100}
  - {beat: 43, pitch: G2, length_beats: 0.5, velocity: 80}
  - {beat: 44, pitch: G1, length_beats: 0.7, velocity: 96}
  - {beat: 46, pitch: D2, length_beats: 0.5, velocity: 100}
  - {beat: 46.5, pitch: F2, length_beats: 0.5, velocity: 84}
  - {beat: 48, pitch: G1, length_beats: 0.7, velocity: 96}
  - {beat: 50, pitch: G1, length_beats: 0.7, velocity: 100}
  - {beat: 51, pitch: G2, length_beats: 0.5, velocity: 80}
  - {beat: 52, pitch: G1, length_beats: 0.7, velocity: 96}
  - {beat: 54, pitch: D2, length_beats: 0.5, velocity: 100}
  - {beat: 54.5, pitch: F2, length_beats: 0.5, velocity: 84}
  - {beat: 56, pitch: G1, length_beats: 0.7, velocity: 96}
