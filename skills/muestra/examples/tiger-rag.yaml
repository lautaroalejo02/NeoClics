automation:
- {target: tracks.sample.fx.lp.cutoff_hz, curve: exp, points: [[1, 500], [9, 18000]]}  # intro filtrada: 4 compases musicales
master:
  fx:
  - {type: compressor, threshold_db: -18, ratio: 3}
  - {type: limiter, ceiling_db: -1.0}
  target_lufs: -12
