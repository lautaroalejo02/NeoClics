schema_version: 0
# Tiger Rag (The Home Towners, 1928; CC0), primeros 30 s, fuente src1.
# El tracker la lee a 250 BPM (cuenta corcheas); source.analyze eligio la octava
# en 70-160 y la grilla quedo en 125 BPM (grid.tempo_factor 0.5). Grilla NORMAL:
# compases musicales, patrones de 16 pasos. Antes de armar el tema, el humano
# confirma la grilla de oido (source.preview_grid).
meta:
  title: tiger-funk
  bpm: 126.32  # 123.08 (tempo local de c1) x 2^(0.45/12): el disco esta 45 cents bajo y +0.45 st lo afina
  key: G  # donde encaja el bajo con el sample (ears: bass_vs_sample)
  length_bars: 16
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other  # sin la bateria ni el bajo del disco
  start_downbeat: 9  # cs001/cand1, el pick auto: mejor vuelta y pulso mas estable
  length_beats: 8  # 2 compases
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 8
phrases:
- id: bajo  # contratiempos en Sol: tonica, tonica, octava, tonica
  length_bars: 1
  notes:
  - {beat: 1.5, pitch: G1, length_beats: 0.4, velocity: 100}
  - {beat: 2.5, pitch: G1, length_beats: 0.4, velocity: 92}
  - {beat: 3.5, pitch: G2, length_beats: 0.4, velocity: 100}
  - {beat: 4.5, pitch: G1, length_beats: 0.4, velocity: 92}
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 8}
  fx:
  - {id: hp, type: highpass, cutoff_hz: 150}  # deja 40-150 Hz para bombo y bajo
  - {id: lp, type: lowpass, cutoff_hz: 18000}  # automatizado abajo
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 140}
  gain_db: 9  # el disco es bajito (-27 LUFS)
- id: kick
  pattern:
    steps_per_bar: 16
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 5
  pattern:
    steps_per_bar: 16
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -5}
      chat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/chat-tr-8-closed-hat-01.wav", steps: "x.o.x.o.x.o.x.o.", gain_db: -12}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -10}
- id: bass
  at_bar: 5
  instrument: {plugin: finger-bass}
  phrases:
  - {phrase: bajo}  # se repite hasta el final
  gain_db: 13
automation:
- {target: tracks.sample.fx.lp.cutoff_hz, curve: exp, points: [[1, 500], [5, 18000]]}  # intro filtrada: 4 compases
master:
  fx:
  - {type: compressor, threshold_db: -18, ratio: 3}
  - {type: limiter, ceiling_db: -1.0}
  target_lufs: -12
