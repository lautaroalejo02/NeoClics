schema_version: 0
# Tiger Rag (The Home Towners, 1928; CC0), primeros 30 s, fuente src1.
# El tracker la mide a ~250 BPM: cuenta corcheas. DOBLE GRILLA:
#   1 compas musical = 2 compases del proyecto, 1 beat del proyecto = 1 corchea,
#   patrones con steps_per_bar: 8 y bars: 2 (16 caracteres = 1 compas musical).
# Ver recipes/future-funk.md, "Fuente a doble tempo".
meta:
  title: tiger-funk
  bpm: 252.64  # 246.15 (tempo local de c1) x 2^(0.45/12): el disco esta 45 cents bajo y +0.45 st lo afina; sensacion 126.3
  key: G  # donde encaja el bajo con el sample (ears: bass_vs_sample)
  length_bars: 32  # 16 compases musicales
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other  # sin la bateria ni el bajo del disco
  start_downbeat: 17  # cs001/cand1, el pick auto: mejor vuelta y pulso mas estable
  length_beats: 16  # 16 beats de la fuente = 2 compases musicales
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 8
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 8}
  fx:
  - {id: hp, type: highpass, cutoff_hz: 150}  # deja 40-150 Hz para bombo y bajo
  - {id: lp, type: lowpass, cutoff_hz: 18000}  # automatizado abajo
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 140}
  gain_db: 9  # el disco es bajito (-27 LUFS)
- id: kick
  pattern:
    steps_per_bar: 8
    bars: 2
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 9  # compas musical 5
  pattern:
    steps_per_bar: 8
    bars: 2
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -5}
      chat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/chat-tr-8-closed-hat-01.wav", steps: "x.o.x.o.x.o.x.o.", gain_db: -12}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -10}
- id: bass
  at_bar: 9
  instrument: {plugin: finger-bass}
  notes:  # contratiempos en Sol, 4 por compas musical (generadas con un loop)
  - {beat: 34, pitch: G1, length_beats: 0.8, velocity: 100}
  - {beat: 36, pitch: G1, length_beats: 0.8, velocity: 92}
  - {beat: 38, pitch: G2, length_beats: 0.8, velocity: 100}
  - {beat: 40, pitch: G1, length_beats: 0.8, velocity: 92}
  - {beat: 42, pitch: G1, length_beats: 0.8, velocity: 100}
