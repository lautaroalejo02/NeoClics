  - {beat: 116, pitch: G#2, length_beats: 0.6, velocity: 96}
  - {beat: 118, pitch: G#1, length_beats: 0.6, velocity: 110}
  - {beat: 120, pitch: G#2, length_beats: 0.6, velocity: 96}
  - {beat: 122, pitch: G#1, length_beats: 0.6, velocity: 110}
  - {beat: 124, pitch: G#2, length_beats: 0.6, velocity: 96}
  - {beat: 126, pitch: G#1, length_beats: 0.6, velocity: 110}
  - {beat: 128, pitch: G#2, length_beats: 0.6, velocity: 96}
  fx:
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 90}
  gain_db: 0
automation:
- {target: tracks.sample.fx.lp.cutoff_hz, curve: exp, points: [[1, 400], [8, 2500], [9, 18000]]}  # sube y abre de golpe en el drop
- {target: tracks.sample.fx.hp.cutoff_hz, curve: exp, points: [[23, 200], [25, 900], [25, 200]]}  # barrido high-pass antes de la ultima vuelta
master:
  fx:
  - {type: compressor, threshold_db: -18, ratio: 3}
  - {type: limiter, ceiling_db: -1.0}
  target_lufs: -12
