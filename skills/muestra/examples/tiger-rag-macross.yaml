schema_version: 0
# Tiger Rag (The Home Towners, 1928; CC0), primeros 30 s, fuente src1.
# El tracker la lee a 250 BPM (cuenta corcheas); source.analyze eligio la octava
# en 70-160 y la grilla quedo en 125 BPM (grid.tempo_factor 0.5). Grilla NORMAL:
# compases musicales, patrones de 16 pasos. Antes de armar el tema, el humano
# confirma la grilla de oido (source.preview_grid).
meta:
  title: tiger-funk-macross
  bpm: 133.15  # 122.45 (tempo local de c1, 4 beats) x 2^(1.45/12): +1.45 st, mas rapido y mas agudo
  key: G#  # un semitono arriba de la version base
  length_bars: 16
  seed: 0
sources:
- id: src1
  file: sources/src1.wav
chops:
- id: c1
  source: src1
  stem: other
  start_downbeat: 9
  length_beats: 4  # 1 compas, repetido: corte corto
  warp: {mode: resample, pitch_semitones: 0}
  fade_ms: 6
- id: c2
  source: src1
  stem: other
  start_downbeat: 9
  length_beats: 1  # una negra, para el stutter
  warp: {mode: resample, pitch_semitones: -0.35}  # su tempo local es 120.0: 12*log2(120/122.45) lo iguala a c1
  fade_ms: 6
phrases:
- id: octavas  # octavas cortas en contratiempo
  length_bars: 1
  notes:
  - {beat: 1.5, pitch: G#1, length_beats: 0.3, velocity: 110}
  - {beat: 2.5, pitch: G#2, length_beats: 0.3, velocity: 96}
  - {beat: 3.5, pitch: G#1, length_beats: 0.3, velocity: 110}
  - {beat: 4.5, pitch: G#2, length_beats: 0.3, velocity: 96}
tracks:
- id: sample
  clips:
  - {chop: c1, at_bar: 1, repeat: 3}
  - {chop: c2, at_bar: 4, repeat: 4}  # stutter: el primer tiempo 4 veces
  - {chop: c1, at_bar: 5, repeat: 3}
  - {chop: c2, at_bar: 8, repeat: 4}  # stutter: el primer tiempo 4 veces
  - {chop: c1, at_bar: 9, repeat: 3}
  - {chop: c2, at_bar: 12, repeat: 4}  # stutter: el primer tiempo 4 veces
  - {chop: c1, at_bar: 13, repeat: 3}
  - {chop: c2, at_bar: 16, repeat: 4}  # stutter: el primer tiempo 4 veces
  fx:
  - {id: hp, type: highpass, cutoff_hz: 200}
  - {id: lp, type: lowpass, cutoff_hz: 18000}
  - {id: sat, type: saturation, drive_db: 8}  # crudo
  - {id: sc, type: sidechain, key_track: kick, depth: 0.7, release_ms: 170}  # bombeo marcado
  gain_db: 8
- id: kick
  pattern:
    steps_per_bar: 16
    lanes:
      kick: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/kick-tr-8-kick-02.wav", steps: "x...x...x...x...", gain_db: -4}
- id: drums
  at_bar: 5
  pattern:
    steps_per_bar: 16
    lanes:
      clap: {sample: "library://kits/essential-kits-musicradar/tr-909-kit/clap-tr-909-clap.wav", steps: "....x.......x...", gain_db: -4}
      ohat: {sample: "library://kits/tr8-hardware-machines/roland-tr-8/ohat-tr-8-open-hat-01.wav", steps: "..x...x...x...x.", gain_db: -9}
- id: bass
  at_bar: 5
  instrument: {plugin: synth-bass}
  phrases:
  - {phrase: octavas}
  fx:
  - {id: sc, type: sidechain, key_track: kick, depth: 0.5, release_ms: 90}
  gain_db: 0
automation:
- {target: tracks.sample.fx.lp.cutoff_hz, curve: exp, points: [[1, 400], [4.5, 2500], [5, 18000]]}  # sube y abre de golpe en el drop
- {target: tracks.sample.fx.hp.cutoff_hz, curve: exp, points: [[12, 200], [13, 900], [13, 200]]}  # barrido high-pass antes de la ultima vuelta
master:
  fx:
  - {type: compressor, threshold_db: -18, ratio: 3}
  - {type: limiter, ceiling_db: -1.0}
  target_lufs: -12
