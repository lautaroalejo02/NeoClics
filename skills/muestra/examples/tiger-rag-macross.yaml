  - {beat: 96, pitch: G#2, length_beats: 0.6, velocity: 96}
  - {beat: 98, pitch: G#1, length_beats: 0.6, velocity: 110}
  - {beat: 100, pitch: G#2, length_beats: 0.6, velocity: 96}
  - {beat: 102, pitch: G#1, length_beats: 0.6, velocity: 110}
  - {beat: 104, pitch: G#2, length_beats: 0.6, velocity: 96}
